apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gameinterface-yeebet.fullname" . }}
  labels:
    {{- include "game-gameinterface-yeebet.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Microsoft.AspNetCore": "Warning",
          "Tgs.GameInterface.YeeBet.Core": "Information"
        }
      },
      "Kestrel": {
        "EndpointDefaults": {
          "Protocols": "Http2"
        },
        "Endpoints": {
          "HealthCheck": {
            "Url": "http://*:{{ .Values.service.port }}",
            "Protocols": "Http1"
          },
          "Grpc": {
            "Url": "http://*:{{ .Values.servicegrpc.port }}"
          }
        }
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]