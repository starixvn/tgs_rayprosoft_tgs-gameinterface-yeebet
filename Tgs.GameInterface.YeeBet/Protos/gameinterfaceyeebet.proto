syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.YeeBet.Protos";

package gameinterfaceyeebet;

// The greeting service definition.
service GameInterfaceYeeBet {
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerCreateByBetLimit (PlayerCreateByBetLimitRequest) returns (BaseReply);
  rpc PlayerUpdateBetLimit (PlayerUpdateBetLimitRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);  
  rpc PlayerLogout (PlayerLogoutRequest) returns (BaseReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc GameRecord (GameRecordRequest) returns (GameRecordReply);
  rpc GameRecordMark (GameRecordMarkRequest) returns (BaseReply);
  rpc GameRecordInquire (GameRecordInquireRequest) returns (GameRecordInfoReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message PlayerCreateRequest {
	string api_url = 1;
	string app_id = 2;	
	string secret_key = 3;
	string player_code = 4;
	int32 client_type = 5;
	string currency = 6;
	int32 language_id = 7;	
}

message PlayerCreateByBetLimitRequest {
	string api_url = 1;
	string app_id = 2;	
	string secret_key = 3;
	string player_code = 4;
	int32 client_type = 5;
	string currency = 6;
	int32 language_id = 7;
	repeated int32 quotas = 8;
}

message PlayerUpdateBetLimitRequest {
	string api_url = 1;
	string app_id = 2;	
	string secret_key = 3;
	string player_code = 4;	
	repeated int32 quotas = 5;
}

message PlayerBalanceRequest {
	string api_url = 1;
	string app_id = 2;	
	string secret_key = 3;
	string player_code = 4;
}


message PlayerLogoutRequest {
	string api_url = 1;
	string app_id = 2;	
	string secret_key = 3;	
	string player_code = 4;
}

message FundRequest {
	string api_url = 1;
	string app_id = 2;	
	string secret_key = 3;	
	string player_code = 4;
	phoenix.protobuf.DecimalValue amount = 5;
}

message FundStatusRequest {
	string api_url = 1;
	string app_id = 2;	
	string secret_key = 3;	
	string player_code = 4;
	string trs_id = 5;
}

message GameUrlRequest {
	string api_url = 1;
	string app_id = 2;
	string secret_key = 3;	
	string player_code = 4;
	int32 client_type = 5;
	int32 language_id = 6;
}

message GameRecordRequest {
	string api_url = 1;
	string app_id = 2;
	string secret_key = 3;		
	int32 size = 4;
}

message GameRecordMarkRequest{
	string api_url = 1;
	string app_id = 2;
	string secret_key = 3;	
	repeated string external_round_ids = 4;
}

message GameRecordInquireRequest {
	string api_url = 1;
	string app_id = 2;
	string secret_key = 3;
	google.protobuf.Timestamp begin_time = 4;
	google.protobuf.Timestamp end_time = 5;
	int32 page_size = 6;
	int32 page_index = 7;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply {
	bool state = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {
	string transaction_id = 1;	
	phoenix.protobuf.DecimalValue balance = 2;	
	string response = 3;
}

message GameUrlReply{
	string game_url = 1;
}

message GameRecordReply {
	repeated GameRecordInfo items = 1;
}

message GameRecordInfo {
	string external_round_id = 1;
	string ExternalGameId = 2;
    string player_code = 3;
	google.protobuf.Timestamp external_created_on = 4;	
	google.protobuf.Timestamp external_closed_on = 5;	
	phoenix.protobuf.DecimalValue bet = 6;
	phoenix.protobuf.DecimalValue valid_bet = 7;
	phoenix.protobuf.DecimalValue settle = 8;
	phoenix.protobuf.DecimalValue turnover = 9;
	phoenix.protobuf.DecimalValue win_loss = 10;
	string additional_data = 11;
	bool is_closed = 12;
	bool is_void = 13;
}

message GameRecordInfoReply{
	int32 total = 1;
	int32 array_size = 2;
	repeated GameRecordInfo items = 3;
}

message CheckingServiceReply{
    string machine_name = 1;
}